name: Production Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # gd dan zip dibutuhkan phpoffice/phpspreadsheet (lewat
          # maatwebsite/excel). Keduanya sempat ikut terbawa karena 8.3
          # adalah PHP bawaan runner; di 8.5 PHP dipasang segar dari PPA
          # dan composer install gagal di pemeriksaan platform.
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, gd, zip, dom, fileinfo, iconv, simplexml, xml, xmlreader, xmlwriter, zlib
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Pint (code style)
        run: vendor/bin/pint --test


  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Aset Vite tidak ada di git (public/build masuk .gitignore), jadi harus
      # dibangun di sini. Tanpa langkah ini rsync --delete justru MENGHAPUS
      # public/build di server dan seluruh halaman tampil kosong.
      - name: Build aset frontend
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='.git/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/www/wwwroot/monevkinerjakw11.my.id/

      - name: Run post-deploy commands
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd /www/wwwroot/monevkinerjakw11.my.id
            composer install --no-dev --no-interaction --optimize-autoloader
            php artisan migrate --force
            # Permission modul (akses-4dx/master/kinerja/pm) dibuat di sini.
            # Tanpa seeder ini modul baru tidak terlihat oleh siapa pun,
            # termasuk admin, karena permission-nya belum ada di database.
            php artisan db:seed --class=RolePermissionSeeder --force
            php artisan db:seed --class=MonevSegmenSeeder --force
            # rsync --delete ikut menghapus symlink public/storage; dibuat ulang.
            php artisan storage:link --force
            # Berkas unggahan hidup di luar git dan tidak ikut rsync.
            mkdir -p storage/app/private/kinerja-files
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart || true
            chown -R www:www storage bootstrap/cache public/build
          EOF
